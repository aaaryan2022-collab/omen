[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omen-assistant"
version = "1.0.0"
description = "OMEN — Local-First AI Laptop Assistant for Windows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OMEN Core Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "apscheduler>=3.10.0",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.6",
    "feedparser>=6.0.10",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "python-dotenv>=1.0.0",
    "qasync>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
omen = "main:main"
