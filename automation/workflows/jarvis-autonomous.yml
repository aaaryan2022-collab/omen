name: JARVIS Autonomous Workflow
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
jobs:
  stark-autonomous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate JARVIS
        run: echo "STARK PROTOCOL ACTIVE — NO MANUAL INTERVENTION"
      - name: Build Docker
        run: docker build -t jarvis-autonomous .
      - name: Run Autonomous Agent
        run: docker run --rm jarvis-autonomous
